<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PatchPro Viewer</title>

<script src="app.js"></script>

<style>
table {
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th, td {
border:1px solid #ddd;
padding:8px;
}

th {
background:#f3f3f3;
text-align:left;
}

td input {
width:100%;
border:none;
outline:none;
}
<body>

<h1 id="title">Loading Show...</h1>

<div class="meta">
<label>Event Name</label>
<input id="eventName">

<label>Venue</label>
<input id="venue">
</div>

<h2>Patch Sheet</h2>
<h2>Band Patch</h2>

<select id="bandSelector"></select>

<table id="bandPatchTable">
<thead>
<tr>
<th>Channel</th>
<th>Instrument</th>
<th>Mic</th>
<th>Notes</th>
</tr>
</thead>
<tbody></tbody>
</table>
<table id="patchTable">
<thead>
<tr>
<th>Channel</th>
<th>Instrument</th>
<th>Mic</th>
<th>Notes</th>
</tr>
</thead>

<tbody></tbody>

</table>

<button onclick="saveShow()">Save</button>

<script src="app.js"></script>

</body>
</html>
