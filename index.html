<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PatchPro Viewer</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 0;
  background: #f2f2f7;
  color: #1d1d1f;
}

/* TOP BAR */
.topbar {
  display: flex;
  justify-content: center;
  padding: 12px;
  background: #ffffff;
  border-bottom: 1px solid #e5e5ea;
}

/* SEGMENTED CONTROL */
.tabs {
  display: flex;
  background: #e5e5ea;
  border-radius: 10px;
  padding: 4px;
}

.tab {
  padding: 6px 16px;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  color: #333;
}

.tab.active {
  background: white;
  box-shadow: 0 1px 2px rgba(0,0,0,0.1);
}

/* MAIN CONTAINER */
.container {
  max-width: 1200px;
  margin: 20px auto;
  padding: 0 20px;
}

/* CARD */
.card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}

/* TITLE */
h1 {
  font-size: 28px;
  margin-bottom: 10px;
}

/* ROW */
.row {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}

input {
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ddd;
  background: #f9f9fb;
  font-size: 14px;
}

/* TABLE */
.table-wrapper {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  background: #f2f2f7;
  padding: 10px;
  font-size: 12px;
  color: #666;
  text-transform: uppercase;
}

td {
  padding: 6px;
  border-bottom: 1px solid #eee;
}

td input {
  width: 100%;
  border: none;
  background: #f9f9fb;
  border-radius: 8px;
  padding: 6px;
}

td input:focus {
  outline: none;
  background: #ffffff;
  box-shadow: 0 0 0 1px #007aff;
}

/* HIDE */
.hidden {
  display: none;
}
</style>

</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('schedule')">Event Schedule</div>
    <div class="tab" onclick="switchTab('patch')">Patch Sheet</div>
  </div>
</div>

<!-- MAIN -->
<div class="container">

  <!-- SCHEDULE VIEW -->
  <div id="scheduleView">

    <div class="card">
      <h1 id="title">New Event</h1>

      <div class="row">
        <input id="startDate" placeholder="Start">
        <input id="endDate" placeholder="End">
        <input id="venue" placeholder="Venue">
      </div>
    </div>

    <div class="card">
      <h3>Event Schedule</h3>
      <div id="scheduleGrid"></div>
    </div>

  </div>

  <!-- PATCH VIEW -->
  <div id="patchView" class="hidden">

    <div class="table-wrapper">
      <table id="patchTable">
        <thead>
          <tr>
            <th>CH</th>
            <th>FEST</th>
            <th>CH</th>
            <th>ARTIST</th>
            <th>BOX</th>
            <th>MIC / DI</th>
            <th>STAND</th>
            <th>+48V</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

  </div>

</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
<script src="app.js"></script>

</body>
</html>
