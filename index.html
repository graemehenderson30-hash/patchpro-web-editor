<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PatchPro Viewer</title>

<style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1e1e1e;
      color: #fff;
      margin: 0;
      padding: 20px;
    }

    h1, h2 {
      margin: 10px 0;
    }

    .meta {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .meta input {
      background: #2c2c2c;
      border: none;
      padding: 8px;
      color: white;
      border-radius: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #2c2c2c;
      padding: 10px;
      text-align: left;
    }

    td {
      padding: 6px;
      border-bottom: 1px solid #333;
    }

    .ch-num {
      width: 50px;
      color: #888;
      font-weight: bold;
    }

    .input {
      width: 100%;
      background: transparent;
      border: none;
      color: white;
      padding: 6px;
    }

    .input:focus {
      outline: none;
      background: #333;
    }
</style>

</head>

<body>

<h1 id="title">Loading Show...</h1>

<div class="meta">
<label>Event Name</label>
<input id="eventName">

<label>Venue</label>
<input id="venue">
</div>

<h2>Patch Sheet</h2>
<h2>Band Patch</h2>

<select id="bandSelector"></select>

<table id="bandPatchTable">
<thead>
<tr>
<th>Channel</th>
<th>Instrument</th>
<th>Mic</th>
<th>Notes</th>
</tr>
</thead>
<tbody></tbody>
</table>

<table id="patchTable">
<thead>
<tr>
<th>Channel</th>
<th>Instrument</th>
<th>Mic</th>
<th>Notes</th>
</tr>
</thead>
<tbody></tbody>
</table>

<button onclick="saveShow()">Save</button>

<script src="app.js"></script>

</body>
</html>
