<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PatchPro Viewer</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 0;
  background: #f5f5f7;
  color: #1d1d1f;
}

/* TOP BAR */
.topbar {
  display: flex;
  justify-content: space-between;
  padding: 10px 20px;
  background: #ffffff;
  border-bottom: 1px solid #ddd;
}

.tabs {
  display: flex;
  gap: 10px;
}

.tab {
  padding: 6px 14px;
  border-radius: 8px;
  background: #e5e5ea;
  cursor: pointer;
}

.tab.active {
  background: #007aff;
  color: white;
}

/* CONTENT */
.container {
  padding: 20px;
}

/* INPUTS */
input {
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ddd;
  width: 100%;
}

/* SCHEDULE */
.schedule-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
  margin-top: 20px;
}

/* PATCH TABLE */
.table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}

.table th {
  background: #e5e5ea;
  padding: 10px;
  text-align: left;
}

.table td {
  padding: 6px;
  border-bottom: 1px solid #ddd;
}

.table input {
  border: none;
  background: #f2f2f7;
  border-radius: 6px;
}

/* HIDE */
.hidden {
  display: none;
}
</style>

</head>

<body>

<div class="topbar">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('schedule')">Event Schedule</div>
    <div class="tab" onclick="switchTab('patch')">Patch Sheet</div>
  </div>
</div>

<div class="container">

  <!-- SCHEDULE -->
  <div id="scheduleView">
    <h1 id="title">New Event</h1>

    <div style="display:flex; gap:10px;">
      <input id="startDate" placeholder="Start">
      <input id="endDate" placeholder="End">
      <input id="venue" placeholder="Venue">
    </div>

    <div class="schedule-grid" id="scheduleGrid"></div>
  </div>

  <!-- PATCH -->
  <div id="patchView" class="hidden">
    <h2>Patch Sheet</h2>

    <table class="table" id="patchTable">
      <thead>
        <tr>
          <th>CH</th>
          <th>FEST</th>
          <th>CH</th>
          <th>ARTIST</th>
          <th>BOX</th>
          <th>MIC / DI</th>
          <th>STAND</th>
          <th>+48V</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
<script src="app.js"></script>

</body>
</html>
